name: KDP Market Monitor

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Execute Scraper
        run: |
          python scripts/scraper.py

      - name: Execute Negative Review Analyzer
        run: |
          python scripts/analyze_reviews.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "MarketIntelligenceBot"
          git config --global user.email "bot@github.local"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update BSR & pain points [skip ci]" && git push)
